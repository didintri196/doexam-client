name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, boundaries, build, bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        entry: [exam, panel]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.entry }}
          push: false
          tags: doexam-${{ matrix.entry }}:ci
          build-args: APP_VERSION=${{ github.sha }}
